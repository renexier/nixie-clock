<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="
width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no
">

<title>Nixie Clock</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="ambient"></div>

<div class="bg-noise"></div>

<div class="clock-wrap">

    <div class="clock" id="clock">

        <div class="tube">
            <div class="digit" id="h1">0</div>
        </div>

        <div class="tube">
            <div class="digit" id="h2">0</div>
        </div>

        <div class="separator">:</div>

        <div class="tube">
            <div class="digit" id="m1">0</div>
        </div>

        <div class="tube">
            <div class="digit" id="m2">0</div>
        </div>

        <div class="separator">:</div>

        <div class="tube">
            <div class="digit" id="s1">0</div>
        </div>

        <div class="tube">
            <div class="digit" id="s2">0</div>
        </div>

    </div>

</div>

<div class="footer" id="footer">

    <div class="timezone" id="timezone">
        TIME ZONE
    </div>

    <div class="creator">
        CREATED BY MAYANK RANJAN
    </div>

    <div class="alias">
        ALIAS : RENEXIER
    </div>

</div>

<button id="toggleCredits">
HIDE INFO
</button>

<button id="fullscreenBtn">
FULLSCREEN
</button>

<script src="script.js"></script>

</body>
</html>
